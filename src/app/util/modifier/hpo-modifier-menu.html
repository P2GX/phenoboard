<div class="modifier-menu-card">
  <label class="section-label">Severity</label>
  <div class="quick-select-row">
    @for (mod of quickModifiers; track mod) {
    <button type="button" class="btn-stroked" (click)="selectQuickModifier(mod)">
      {{ mod }}
    </button>
    }
  </div>

  <div class="inline-modifier-header">
    <span class="inline-label">Modifiers</span>

    <div class="custom-autocomplete-container">
      <div class="input-wrapper">
        <input
          type="text"
          #hpoInput
          [placeholder]="placeholder()"
          [formControl]="control"
          (focus)="onFocus()"
          spellcheck="false"
          autocomplete="off"
        />

        @if (control.value) {
        <button type="button" class="icon-btn clear-btn" aria-label="Clear" (click)="clear()">
          <app-icon name="close" [size]="16" />
        </button>
        }
      </div>

      @if (isOpen() && options().length > 0) {
        <ul class="autocomplete-dropdown">
          @for (option of options(); track $index) {
          <li (click)="selectOption(option)">
            <div class="option-container">
              <span class="option-matched-text">{{ option.hpoLabel }}</span>
              <small class="option-id">({{ option.hpoId }})</small>
            </div>
          </li>
          }
        </ul>
      }
    </div>
  </div>
</div>
