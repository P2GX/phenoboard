<dialog #dialogEl class="orcid-modal hpo-terms-modal">
  <div class="dialog-content">
    <div class="review-header">
      <h2>HPO Terms</h2>
    </div>

    <div class="dialog-body">
      <table class="min-w-full border-collapse custom-curation-table">
        <thead>
          <tr>
            <th class="px-2 py-1">HPO ID</th>
            <th class="px-2 py-1">Label</th>
            <th class="px-2 py-1">Status</th>
          </tr>
        </thead>
        <tbody>
          @for (entry of entries; track entry; let i = $index) {
            <tr>
              <td class="px-2 py-1 font-mono text-sm">{{ entry.hpoId }}</td>
              <td class="px-2 py-1">{{ entry.label }}</td>
              <td class="px-2 py-1">
                @if (editMode) {
                  <select [(ngModel)]="entries[i].status" class="form-select">
                    <option value="observed">Observed</option>
                    <option value="excluded">Excluded</option>
                  </select>
                } @else {
                  <span
                    class="status-badge"
                    [ngClass]="{
                      'observed': entry.status === 'observed',
                      'excluded': entry.status === 'excluded'
                    }"
                  >
                    {{ entry.status }}
                  </span>
                }
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>

    <div class="dialog-actions">
      <button type="button" class="btn-outline-cancel" (click)="onCancel()">Close</button>

      @if (editMode) {
        <button type="button" class="btn-outline-cancel" (click)="toggleEdit()">Cancel Edit</button>
        <button type="button" class="btn-outline-primary" (click)="onSave()">Save</button>
      } @else {
        <button type="button" class="btn-outline-primary" (click)="toggleEdit()">Edit</button>
      }
    </div>
  </div>
</dialog>
