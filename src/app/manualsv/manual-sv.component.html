<dialog #dialogEl class="orcid-modal manual-sv-modal">
  <div class="dialog-content">
    <div class="review-header">
      <h2>Add Structural Variant</h2>
    </div>

    <div class="dialog-body">
      <form [formGroup]="form" class="form-container">
        <div class="form-field">
          <label for="chromosome">Chromosome</label>
          <input id="chromosome" type="text" formControlName="chromosome" autocomplete="off" />
        </div>

        <div class="form-field">
          <label for="label">Label</label>
          <input id="label" type="text" formControlName="label" autocomplete="off" />
        </div>

        <div class="form-field">
          <label for="geneSymbol">Gene Symbol</label>
          <input id="geneSymbol" type="text" formControlName="geneSymbol" autocomplete="off" />
        </div>

        <div class="form-field">
          <label for="transcript">Transcript</label>
          <input id="transcript" type="text" formControlName="transcript" autocomplete="off" />
        </div>

        <div class="form-field">
          <label for="hgncId">HGNC ID</label>
          <input id="hgncId" type="text" formControlName="hgncId" autocomplete="off" />
        </div>

        <div class="form-field">
          <label for="svType">Structural variant category</label>
          <select id="svType" formControlName="svType">
            @for (option of svTypeOptions; track option.value) {
              <option [value]="option.value">
                {{ option.label }}
              </option>
            }
          </select>
        </div>
      </form>
    </div>

    <div class="dialog-actions">
      <button type="button" class="btn-outline-cancel" (click)="onCancel()">Cancel</button>
      <button type="button" class="btn-outline-primary" [disabled]="form.invalid" (click)="onSave()">Save</button>
    </div>
  </div>
</dialog>
