<dialog #dialogEl class="orcid-modal value-mapping-modal">
  <div class="dialog-content">
    <div class="review-header">
      <h2>Map Values to {{ header() }}</h2>
    </div>

    <div class="dialog-body">
      <h3 class="mb-4">{{ hpoLabel() }} ({{ hpoId() }})</h3>

      <table class="native-table w-full">
        <thead>
          <tr>
            <th>Original Value</th>
            <th>Mapped State</th>
          </tr>
        </thead>
        <tbody>
          @for (val of uniqueValues(); track val) {
            <tr>
              <td>
                <span class="status-text">{{ val }}</span>
              </td>
              <td>
                <div class="custom-toggle-group">
                  <button
                    type="button"
                    class="toggle-btn scant-padding status-observed"
                    [class.active]="valueToStateMap[val] === 'observed'"
                    (click)="valueToStateMap[val] = 'observed'"
                  >Obs</button>

                  <button
                    type="button"
                    class="toggle-btn scant-padding status-excluded"
                    [class.active]="valueToStateMap[val] === 'excluded'"
                    (click)="valueToStateMap[val] = 'excluded'"
                  >Excl</button>

                  <button
                    type="button"
                    class="toggle-btn scant-padding status-na"
                    [class.active]="valueToStateMap[val] === 'na'"
                    (click)="valueToStateMap[val] = 'na'"
                  >NA</button>

                  <button
                    type="button"
                    class="toggle-btn scant-padding status-observed"
                    [class.active]="valueToStateMap[val] === 'observed;HP:0012825'"
                    (click)="valueToStateMap[val] = 'observed;HP:0012825'"
                  >Mild</button>

                  <button
                    type="button"
                    class="toggle-btn scant-padding status-observed"
                    [class.active]="valueToStateMap[val] === 'observed;HP:0012826'"
                    (click)="valueToStateMap[val] = 'observed;HP:0012826'"
                  >Mod</button>

                  <button
                    type="button"
                    class="toggle-btn scant-padding status-observed"
                    [class.active]="valueToStateMap[val] === 'observed;HP:0012828'"
                    (click)="valueToStateMap[val] = 'observed;HP:0012828'"
                  >Sev</button>
                </div>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>

    <div class="dialog-actions">
      <button type="button" class="btn-outline-cancel" (click)="onCancel()">Cancel</button>
      <button type="button" class="btn-outline-primary" (click)="onSave()">Save</button>
    </div>
  </div>
</dialog>
